      - name: Validate expected folders exist
        shell: bash
        run: |
          set -euo pipefail

          expected_dirs=(
            "scripts"
            "styles"
          )

          for dir in "${expected_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "::error::Expected folder missing: $dir"
              exit 1
            fi
          done

          if [ ! -d "assets" ]; then
            echo "No assets folder found. Skipping assets."
          fi

      - name: Build validation zip
        shell: bash
        run: |
          set -euo pipefail

          rm -f idle-token-animation.zip

          zip_args=(
            idle-token-animation.zip
            module.json
            README.md
            LICENSE
            scripts
            styles
          )

          if [ -d "assets" ]; then
            zip_args+=(assets)
          fi

          if [ -d "templates" ]; then
            zip_args+=(templates)
          fi

          zip -r "${zip_args[@]}" \
            -x "*.git*" \
            -x "*.github*"

          if [ ! -s idle-token-animation.zip ]; then
            echo "::error::idle-token-animation.zip was not created"
            exit 1
          fi

          unzip -l idle-token-animation.zip
